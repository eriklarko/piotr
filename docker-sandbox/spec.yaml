schemaVersion: "1"
kind: sandbox
name: pi
displayName: Pi
description: The pi coding agent, running in an isolated Docker Sandbox.

sandbox:
  # Built from the Dockerfile next to this file. `make image` builds it and
  # loads it into the sbx image store; `make validate` checks that this tag
  # still matches the pi version pinned in the Dockerfile.
  image: "pi-sandbox:0.85.1"
  aiFilename: AGENTS.md
  entrypoint:
    # Private-prefix install (not on PATH).
    run: [/usr/lib/pi-kit/pi/node_modules/.bin/pi]

environment:
  variables:
    # The proxy swaps the real token into outbound GitHub requests. This
    # placeholder only exists so gh believes it is authenticated.
    GH_TOKEN: proxy-managed
    GITHUB_TOKEN: proxy-managed
    PARANOID_MODE: "true"

network:
  # Domain-level allowlist. If pi or a tool gets blocked, find the domain in
  # `sbx policy log` and add it here. Toolchain downloads happen at image build
  # time on the host, so they do not need an entry.
  allowedDomains:
    # GitHub API, git over HTTPS, and release downloads
    - "github.com:443"
    - "api.github.com:443"
    # Model catalog refresh
    - "pi.dev:443"
    # npm, for installing packages into a workspace
    - "registry.npmjs.org:443"
    # Cursor, for the pi-cursor-sdk package in config/settings.json. Not
    # commented out like the providers below: the extension refreshes its
    # model catalog during startup, so without this every session begins with
    # a "Cursor model discovery failed / blocked by network policy" warning and
    # a fallback catalog, whether or not Cursor models are used. Auth is not
    # inherited from Cursor Agent CLI/Desktop -- /login (Use an API key ->
    # Cursor) or CURSOR_API_KEY inside the sandbox -- and after adding auth
    # mid-session, /cursor-refresh-models picks up the live catalog without a
    # restart.
    - "api.cursor.com:443"
    #
    # REQUIRED, not optional: uncomment whichever model provider you use below
    # before your first `safe-pi`. None is enabled by default, so `/login`
    # inside a fresh sandbox has nothing to reach until one of these (or
    # another provider's domain, added the same way) is uncommented. See
    # "Setup" in the root README.
    #
    # GitHub Copilot models
    # - "api.githubcopilot.com:443"
    # - "api.individual.githubcopilot.com:443"
    # - "copilot-proxy.githubusercontent.com:443"
    # Other model providers pi can be pointed at
    # - "api.anthropic.com:443"
    # - "api.openai.com:443"
    # - "generativelanguage.googleapis.com:443"

agentContext: |
  ## Sandbox environment

  You are running as the pi coding agent inside a Docker Sandbox microVM.

  - The workspace is mounted at its absolute host path. That is your working
    directory.
  - `sudo` is passwordless. Use it for package installs.
  - Network access is deny-by-default and proxied through the host. Only
    allowlisted domains resolve; raw TCP, UDP, and ICMP are blocked. If a
    request fails with a policy error, tell the user which domain you need
    rather than trying to work around it.
  - The GitHub token is never present in this VM. `GH_TOKEN` holds a
    placeholder and the host proxy injects the real credential into outbound
    GitHub requests, so `gh` and `git push` work normally.
  - `gh auth`, `gh repo`, `gh secret`, `gh ssh-key`, `gh gpg-key`, and `gh api`
    are blocked on purpose. Do not attempt to bypass the wrapper (including by
    hitting the GitHub API directly with `curl`/`bash` where those are
    active — the same account-scoped actions are off limits either way).
  - A service on the host is reachable at `host.docker.internal`, never at
    `localhost` — `localhost` is this VM.
